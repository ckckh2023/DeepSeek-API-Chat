name: Check

# 只做 type / test / lint，不打包。与四个 build workflow 分开：
# build 只在 push 到 main 时跑，这里额外覆盖 pull_request，让问题在合并之前就红。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # oxfmt --check 暂不接入：仓库现有 108 个文件与当前 oxfmt 输出不一致
      # （66 个只缺文件末尾换行，42 个是折行差异）。要接入必须先单独做完那次格式化提交，
      # 否则这个 job 从第一天就是红的，然后所有人学会无视它。
      - name: Type check, unit tests, lint
        run: pnpm check
